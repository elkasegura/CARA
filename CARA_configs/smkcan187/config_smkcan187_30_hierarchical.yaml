clustering:
  cluster_on_correlation: true
  number_of_clusters: 30
  parameters: searching
  range_n_clusters: 0
  strategy: Hierarchical
dataset:
  input_folder: data/
  label_column: label_smk_can_187
  name: SMK-CAN-187
  scaler: standard
filters:
  autoencoder_parameters:
    AE_name: LinearAE
    epochs: 100
    lr: 0.001
    n_layers:
    - 1
    - 2
    - 3
    - 4
  filter_type: AE
  medoid_parameters:
    distance_metric: euclidean
output:
  logs_folder: Model_results/CARA/results_CARA_smkcan187/output_smkcan187_30_hierarchical
  output_folder: Model_results/CARA/results_CARA_smkcan187/output_smkcan187_30_hierarchical
